# Phục vụ giao diện React (SPA) + chuyển tiếp /api, /uploads, Swagger sang container backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tải file (nhập Excel, ảnh biên lai) tối đa 10MB giống backend
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Dùng DNS nội bộ của Docker và phân giải tên "backend" lúc có request:
    # nginx vẫn khởi động được kể cả khi backend chưa lên xong.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # File JS/CSS do Vite sinh ra có mã băm trong tên -> cache lâu dài
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api|uploads|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Mọi đường dẫn khác (vd: /orders/123, /reset-password?token=...) trả về index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
